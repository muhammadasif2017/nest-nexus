name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            cd ${{ secrets.VM_APP_DIR }} &&
            export IMAGE_TAG=${{ env.IMAGE_TAG }} &&
            docker compose -f docker-compose.prod.yml pull app &&
            docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy &&
            docker compose -f docker-compose.prod.yml up -d &&
            timeout 60 sh -c "until docker compose -f docker-compose.prod.yml ps app | grep -q healthy; do sleep 2; done" &&
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          '
